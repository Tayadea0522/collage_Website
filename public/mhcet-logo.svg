<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <style>
    .arc-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #1a428a; letter-spacing: 2px; }
    .bottom-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #1a428a; letter-spacing: 5px; }
  </style>

  <defs>
    <!-- Top text arc -->
    <path id="topArcPath" d="M 32,150 A 118,118 0 1,1 268,150" fill="none" />
    <!-- Bottom text arc -->
    <path id="bottomArcPath" d="M 262,150 A 112,112 0 0,1 38,150" fill="none" />
  </defs>

  <!-- Background Base -->
  <circle cx="150" cy="150" r="146" fill="#ffffff" stroke="#1a428a" stroke-width="7" />
  
  <!-- Outer Ring Inner Border -->
  <circle cx="150" cy="150" r="126" fill="none" stroke="#1a428a" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Outer Ring Text: Top -->
  <text class="arc-text" font-size="16">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      STATE COMMON ENTRANCE TEST CELL
    </textPath>
  </text>

  <!-- Dots separators -->
  <circle cx="43" cy="158" r="5" fill="#1a428a" />
  <circle cx="257" cy="158" r="5" fill="#1a428a" />

  <!-- Outer Ring Text: Bottom -->
  <text class="bottom-text" font-size="16">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      MAHARASHTRA
    </textPath>
  </text>

  <!-- Inner Blue Main Circle -->
  <circle cx="150" cy="150" r="92" fill="#1a428a" stroke="#1a428a" stroke-width="2" />

  <!-- CET White Graphic Center -->
  <g fill="#ffffff">
    <!-- Letter C -->
    <path d="M 112,108 C 82,108 62,124 62,150 C 62,176 82,192 112,192 L 126,192 C 122,180 120,168 120,150 C 120,132 122,120 126,108 Z M 108,124 L 115,124 C 102,130 96,138 96,150 C 96,162 102,170 115,176 L 108,176 C 92,176 80,165 80,150 C 80,135 92,124 108,124 Z" />
    
    <!-- Stylized CET shapes matching the seal -->
    <!-- CET Main emblem block -->
    <path d="M 68,150 C 68,126 88,108 116,108 L 132,108 C 130,122 128,136 128,150 C 128,164 130,178 132,192 L 116,192 C 88,192 68,174 68,150 Z" />
    
    <!-- Middle bars for E and T -->
    <!-- E top bar -->
    <path d="M 138,108 L 180,108 A 6,6 0 0,1 186,114 L 186,128 A 6,6 0 0,1 180,134 L 138,134 Z" />
    <!-- E mid bar -->
    <path d="M 138,137 L 180,137 A 6,6 0 0,1 186,143 L 186,157 A 6,6 0 0,1 180,163 L 138,163 Z" />
    <!-- E bottom bar -->
    <path d="M 138,166 L 180,166 A 6,6 0 0,1 186,172 L 186,186 A 6,6 0 0,1 180,192 L 138,192 Z" />
    
    <!-- T top bar and stem -->
    <path d="M 192,108 L 236,108 A 6,6 0 0,1 242,114 L 242,128 A 6,6 0 0,1 236,134 L 222,134 L 222,186 A 6,6 0 0,1 216,192 L 202,192 A 6,6 0 0,1 196,186 L 196,134 L 192,134 Z" />
  </g>
</svg>
