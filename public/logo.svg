<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F386B" />
      <stop offset="100%" stop-color="#071931" />
    </linearGradient>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0A2342" />
    </linearGradient>
    <linearGradient id="greenLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Left Laurel Wreath -->
  <g fill="url(#greenLeaf)">
    <path d="M 115 70 C 100 80, 95 100, 92 120 C 90 140, 96 160, 110 175 C 100 160, 95 140, 97 120 C 99 100, 105 85, 115 70 Z" />
    <!-- Leaf pair 1 -->
    <path d="M 112 75 C 98 62, 90 70, 95 82 C 102 85, 110 82, 112 75 Z" />
    <path d="M 106 95 C 90 85, 84 95, 90 106 C 98 108, 105 102, 106 95 Z" />
    <!-- Leaf pair 2 -->
    <path d="M 100 118 C 82 112, 78 124, 86 132 C 94 132, 100 125, 100 118 Z" />
    <path d="M 98 140 C 82 138, 80 150, 88 156 C 96 154, 100 146, 98 140 Z" />
    <!-- Leaf pair 3 -->
    <path d="M 104 160 C 90 162, 92 174, 100 176 C 106 172, 108 164, 104 160 Z" />
  </g>

  <!-- Right Laurel Wreath -->
  <g fill="url(#greenLeaf)">
    <path d="M 285 70 C 300 80, 305 100, 308 120 C 310 140, 304 160, 290 175 C 300 160, 305 140, 303 120 C 301 100, 295 85, 285 70 Z" />
    <!-- Leaf pair 1 -->
    <path d="M 288 75 C 302 62, 310 70, 305 82 C 298 85, 290 82, 288 75 Z" />
    <path d="M 294 95 C 310 85, 316 95, 310 106 C 302 108, 295 102, 294 95 Z" />
    <!-- Leaf pair 2 -->
    <path d="M 300 118 C 318 112, 322 124, 314 132 C 306 132, 300 125, 300 118 Z" />
    <path d="M 302 140 C 318 138, 320 150, 312 156 C 304 154, 300 146, 302 140 Z" />
    <!-- Leaf pair 3 -->
    <path d="M 296 160 C 310 162, 308 174, 300 176 C 294 172, 292 164, 296 160 Z" />
  </g>

  <!-- Graduation Cap (Mortarboard) -->
  <g fill="#0A2342">
    <!-- Cap Top Diamond -->
    <polygon points="200,20 275,48 200,75 125,48" fill="#071931" stroke="#0F386B" stroke-width="2" />
    <!-- Cap Skull Base -->
    <path d="M 152 58 L 152 82 C 152 95, 248 95, 248 82 L 248 58 Z" fill="#0A2342" />
    <!-- Tassel -->
    <path d="M 252 50 Q 258 60, 255 82" stroke="#D97706" stroke-width="3" fill="none" />
    <circle cx="255" cy="84" r="3.5" fill="#D97706" />
  </g>

  <!-- Stylized Fountain Pen Nib -->
  <path d="M 200 48 L 222 135 C 220 148, 200 158, 200 158 C 200 158, 180 148, 178 135 Z" fill="#0A2342" />
  <!-- Nib Slit & Hole -->
  <line x1="200" y1="48" x2="200" y2="120" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="200" cy="115" r="5" fill="#FFFFFF" />

  <!-- Open Book Pages (Blue & Green Curved Layers) -->
  <!-- Left Pages -->
  <path d="M 200 158 Q 150 130, 85 155 Q 150 170, 200 195 Z" fill="url(#bookBlue)" />
  <path d="M 200 165 Q 155 142, 95 162 Q 155 178, 200 195 Z" fill="#2563EB" opacity="0.8" />
  <path d="M 200 172 Q 160 152, 108 170 Q 160 184, 200 195 Z" fill="#15803D" />

  <!-- Right Pages -->
  <path d="M 200 158 Q 250 130, 315 155 Q 250 170, 200 195 Z" fill="url(#bookBlue)" />
  <path d="M 200 165 Q 245 142, 305 162 Q 245 178, 200 195 Z" fill="#2563EB" opacity="0.8" />
  <path d="M 200 172 Q 240 152, 292 170 Q 240 184, 200 195 Z" fill="#15803D" />

  <!-- College Typography -->
  <!-- Line 1: LATE SHAKTIKUMAR SANCHETI -->
  <text x="200" y="222" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#0A2342" text-anchor="middle" letter-spacing="1">
    LATE SHAKTIKUMAR SANCHETI
  </text>

  <!-- Line 2: COLLEGE OF DAIRY TECHNOLOGY -->
  <text x="200" y="248" font-family="Georgia, serif" font-weight="900" font-size="20" fill="#071931" text-anchor="middle" letter-spacing="0.5">
    COLLEGE OF DAIRY TECHNOLOGY
  </text>

  <!-- Line 3: MALKAPUR with green lines -->
  <line x1="85" y1="272" x2="135" y2="272" stroke="#15803D" stroke-width="2" />
  <text x="200" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#15803D" text-anchor="middle" letter-spacing="3">
    MALKAPUR
  </text>
  <line x1="265" y1="272" x2="315" y2="272" stroke="#15803D" stroke-width="2" />

  <!-- Line 4: Motto -->
  <text x="200" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#0A2342" text-anchor="middle" letter-spacing="2">
    KNOWLEDGE • INNOVATION • EXCELLENCE
  </text>
</svg>
