<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Top Arc Path for Sanskrit Motto -->
    <path id="mafsuTopArc" d="M 38,160 A 122,122 0 1,1 282,160" fill="none" />
    <!-- Bottom Arc Path for University Name -->
    <path id="mafsuBottomArc" d="M 282,160 A 122,122 0 0,1 38,160" fill="none" />
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="160" cy="160" r="156" fill="#FFFFFF" stroke="#222B78" stroke-width="4" />
  
  <!-- Outer Ring Gold Background -->
  <path d="M 160,12 A 148,148 0 1,1 159.9,12 Z M 160,34 A 126,126 0 1,0 160.1,34 Z" fill="#D3A751" />

  <!-- Outer Ring Inner & Outer Dark Lines -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#222B78" stroke-width="2" />
  <circle cx="160" cy="160" r="126" fill="none" stroke="#222B78" stroke-width="2" />

  <!-- Top Arc Text (Sanskrit Motto) -->
  <text font-family="'Noto Sans Devnagari', Arial, sans-serif" font-weight="700" font-size="11" fill="#1C1D21">
    <textPath href="#mafsuTopArc" startOffset="50%" text-anchor="middle">
      पशुमत्स्यधनं नित्यं सर्वलोकोपकारकम् । शोधशिक्षणजं कार्यं ज्ञानकौशल्यदायकम् ॥
    </textPath>
  </text>

  <!-- Side Blue Dots -->
  <circle cx="28" cy="160" r="5" fill="#222B78" />
  <circle cx="292" cy="160" r="5" fill="#222B78" />

  <!-- Bottom Arc Text (University Name) -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11.5" fill="#1C1D21" letter-spacing="1.2">
    <textPath href="#mafsuBottomArc" startOffset="50%" text-anchor="middle">
      MAHARASHTRA ANIMAL &amp; FISHERY SCIENCES UNIVERSITY NAGPUR
    </textPath>
  </text>

  <!-- Two Golden Fish Motifs at Bottom Joining Center -->
  <g fill="#D3A751" stroke="#1C1D21" stroke-width="1.5">
    <!-- Left Fish -->
    <path d="M 160,272 C 145,285 125,295 102,268 C 120,250 142,248 160,272 Z" />
    <circle cx="132" cy="254" r="3" fill="#1C1D21" stroke="none" />
    
    <!-- Right Fish -->
    <path d="M 160,272 C 175,285 195,295 218,268 C 200,250 178,248 160,272 Z" />
    <circle cx="188" cy="254" r="3" fill="#1C1D21" stroke="none" />
  </g>

  <!-- Inner Center Heart/Cattle Shield Outline -->
  <path d="M 160,42 C 215,42 254,82 254,145 C 254,208 185,268 160,276 C 135,268 66,208 66,145 C 66,82 105,42 160,42 Z" fill="#FFFFFF" stroke="#1C1D21" stroke-width="2.5" />

  <!-- Central Deep Blue Book & Cattle Shield Graphic -->
  <g fill="#2B308B">
    <!-- Blue Book & Cattle Head Silhouette background -->
    <path d="M 88,100 L 88,180 Q 160,228 232,180 L 232,100 Q 160,118 88,100 Z" />
    <!-- Horns & Top Crown of Cattle -->
    <path d="M 110,72 C 122,86 128,102 128,114 L 192,114 C 192,102 198,86 210,72 C 192,82 182,90 178,100 L 142,100 C 138,90 128,82 110,72 Z" fill="#2B308B" />
  </g>

  <!-- White Cattle Face & Ear Silhouettes inside Blue Shape -->
  <path d="M 98,116 C 118,116 124,124 132,142 C 138,155 142,168 160,168 C 178,168 182,155 188,142 C 196,124 202,116 222,116 C 212,128 206,140 198,162 Q 160,188 122,162 C 114,140 108,128 98,116 Z" fill="#FFFFFF" />

  <!-- Golden Caduceus (Medical Staff & Serpent Symbol) in center -->
  <g fill="#D3A751" stroke="#2B308B" stroke-width="0.5">
    <!-- Staff -->
    <rect x="158" y="90" width="4" height="68" rx="2" fill="#D3A751" />
    <!-- Top Emblem ball -->
    <circle cx="160" cy="88" r="4" fill="#D3A751" />
    <!-- Wings at top -->
    <path d="M 160,94 C 146,86 132,92 126,98 C 138,100 150,98 160,98 C 170,98 182,100 194,98 C 188,92 174,86 160,94 Z" />
    <!-- Coiled Snakes -->
    <path d="M 160,102 Q 148,110 160,120 Q 172,130 160,140 Q 148,150 160,158" fill="none" stroke="#D3A751" stroke-width="2.5" />
    <path d="M 160,102 Q 172,110 160,120 Q 148,130 160,140 Q 172,150 160,158" fill="none" stroke="#D3A751" stroke-width="2.5" />
  </g>

  <!-- Established Text "स्थापना २०००" -->
  <text x="160" y="184" font-family="'Noto Sans Devnagari', Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">
    स्थापना २०००
  </text>

  <!-- White Book Page Stripe Lines at Bottom of Blue Shield -->
  <path d="M 94,182 Q 160,212 226,182" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 96,188 Q 160,220 224,188" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 98,194 Q 160,226 222,194" fill="none" stroke="#FFFFFF" stroke-width="3" />
</svg>
